name: Desktop & Mobile Releases (Windows / Linux / macOS / Android)

# Builds the desktop JAR with JDK 17, Rust JNI natives for Windows/Linux/macOS and a
# debug Android APK, then packages ready-to-run ZIPs and publishes a GitHub Release.
# Manual trigger from the Actions tab; a push whose message contains [release]
# also triggers it, so this works on branches other than the default one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v8-arena-1'
        required: true
        default: 'v8-arena-1'
      build:
        description: 'In-game build version string'
        required: true
        default: 'arena-1'
      bundle_jre:
        description: 'Bundle a Java 17 runtime into the desktop ZIPs'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Create or update the GitHub Release'
        type: boolean
        required: false
        default: true
  push:
    branches:
      - 'arena/3268cd66-mindustry'

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v8-arena-1' }}
  BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.build || 'arena-1' }}
  BUNDLE_JRE: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_jre }}
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

jobs:
  macos-native:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-apple-darwin, aarch64-apple-darwin

    - name: Build universal macOS dylib
      run: |
        set -euo pipefail
        cargo build --release --target x86_64-apple-darwin --manifest-path rust/mindustry-native/Cargo.toml
        cargo build --release --target aarch64-apple-darwin --manifest-path rust/mindustry-native/Cargo.toml
        mkdir -p macos-assets
        lipo -create \
          rust/mindustry-native/target/x86_64-apple-darwin/release/libmindustry_native.dylib \
          rust/mindustry-native/target/aarch64-apple-darwin/release/libmindustry_native.dylib \
          -output macos-assets/libmindustry_native64.dylib
        lipo -info macos-assets/libmindustry_native64.dylib
        nm -gU macos-assets/libmindustry_native64.dylib | grep -q _Java_mindustry_ai_RustPathfinder_build
        nm -gU macos-assets/libmindustry_native64.dylib | grep -q _Java_mindustry_async_RustAvoidance_build
        tar -czf macos-assets.tar.gz -C macos-assets .

    - name: Upload macOS native
      uses: actions/upload-artifact@v7
      with:
        name: macos-native
        path: macos-assets.tar.gz
        if-no-files-found: error

  build:
    needs: macos-native
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Fetch pinned Arc
      run: |
        set -euo pipefail
        hash="$(sed -n 's/^archash=//p' gradle.properties | tr -d '\r')"
        echo "Arc pin: $hash"
        mkdir -p ../Arc
        cd ../Arc
        git init -q
        git remote add origin https://github.com/Anuken/Arc.git
        if ! git fetch -q --depth 1 origin "$hash"; then
          echo "Pinned Arc commit is not fetchable, falling back to master."
          git fetch -q --depth 1 origin master
        fi
        git checkout -q FETCH_HEAD
        git rev-parse --short HEAD

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-gnu

    - name: Download macOS native
      uses: actions/download-artifact@v7
      with:
        name: macos-native
        path: build/macos

    - name: Install macOS native into assets
      run: |
        set -euo pipefail
        tar -xzf build/macos/macos-assets.tar.gz -C build/macos
        cp build/macos/libmindustry_native64.dylib core/assets/libmindustry_native64.dylib
        cp build/macos/libmindustry_native64.dylib core/assets/libmindustry_nativearm64.dylib

    - name: Build Rust pathfinder (Linux)
      run: |
        cargo build --release --manifest-path rust/mindustry-native/Cargo.toml
        cp rust/mindustry-native/target/release/libmindustry_native.so core/assets/libmindustry_native64.so

    - name: Build Rust pathfinder (Windows)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq mingw-w64
        CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path rust/mindustry-native/Cargo.toml
        cp rust/mindustry-native/target/x86_64-pc-windows-gnu/release/mindustry_native.dll core/assets/mindustry_native64.dll

    - name: Verify bundled natives
      run: |
        set -euo pipefail
        ls -lh core/assets/libmindustry_native64.so core/assets/mindustry_native64.dll \
          core/assets/libmindustry_native64.dylib core/assets/libmindustry_nativearm64.dylib
        nm -D core/assets/libmindustry_native64.so | grep -q Java_mindustry_ai_RustPathfinder_build
        nm -D core/assets/libmindustry_native64.so | grep -q Java_mindustry_async_RustAvoidance_build
        file core/assets/mindustry_native64.dll | grep -q PE32
        file core/assets/libmindustry_native64.dylib | grep -q Mach-O
        file core/assets/libmindustry_nativearm64.dylib | grep -q Mach-O

    - name: Build desktop JAR
      run: |
        ./gradlew desktop:dist --stacktrace -Pbuildversion="$BUILD_VERSION" -PshowCommitHash
        test -s desktop/build/libs/Mindustry.jar
        ls -lh desktop/build/libs/Mindustry.jar

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

    - name: Build Android APK
      env:
        # GitHub Actions sets CI=true, which makes android/build.gradle expect a private
        # upstream release keystore. Debug builds do not need it.
        CI: 'false'
      run: |
        set -euo pipefail
        # The desktop JAR is already built; keep desktop-only JNI natives out of the APK's
        # merged assets. A fresh Gradle process also picks up ANDROID_HOME/CI from this step.
        rm -f core/assets/libmindustry_native64.so core/assets/mindustry_native64.dll \
          core/assets/libmindustry_native64.dylib core/assets/libmindustry_nativearm64.dylib
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        ./gradlew --stop || true
        ./gradlew --no-daemon android:assembleDebug --stacktrace -Pbuildversion="$BUILD_VERSION" -PshowCommitHash
        apk="$(find android/build/outputs/apk/debug -name '*.apk' -print -quit)"
        test -n "$apk"
        cp "$apk" build/Mindustry-Android.apk
        ls -lh build/Mindustry-Android.apk

    - name: Package Windows, Linux, macOS and Android builds
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/scripts/package-desktop.sh

    - name: Publish GitHub Release
      if: env.PUBLISH == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        assets=(
          build/Mindustry-Windows-x64.zip
          build/Mindustry-Linux-x64.zip
          build/Mindustry-macOS-x64.zip
          build/Mindustry-macOS-arm64.zip
          build/Mindustry-Android.apk
          build/Mindustry.jar
          build/SHA256SUMS.txt
        )
        for asset in "${assets[@]}"; do test -s "$asset"; done
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Updating existing release $TAG"
          gh release edit "$TAG" \
            --title "Mindustry 8 — Windows / Linux / macOS / Android ($TAG)" \
            --notes-file build/release-notes.md \
            --target "$GITHUB_SHA"
          gh release upload "$TAG" "${assets[@]}" --clobber
        else
          echo "Creating release $TAG at $GITHUB_SHA"
          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Mindustry 8 — Windows / Linux / macOS / Android ($TAG)" \
            --notes-file build/release-notes.md
        fi
        gh release view "$TAG" --json url,tagName,assets --jq '{url, tagName, assets: [.assets[].name]}'

    - name: Upload build artifacts
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: mindustry-release-builds
        path: |
          build/Mindustry-Windows-x64.zip
          build/Mindustry-Linux-x64.zip
          build/Mindustry-macOS-x64.zip
          build/Mindustry-macOS-arm64.zip
          build/Mindustry-Android.apk
          build/Mindustry.jar
          build/SHA256SUMS.txt
          build/release-notes.md
        if-no-files-found: warn
