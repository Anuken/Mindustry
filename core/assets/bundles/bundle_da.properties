lglobal.@clientUnit = Klientenhed der kører koden
lglobal.@clientName = Spillernavn på klienten der kører koden
lglobal.@clientTeam = Hold-ID for klienten der kører koden
lglobal.@clientMobile = True is the client running the code is on mobile, false otherwise
lglobal.@clientMusicPlaying = Sandt hvis der aktuelt afspilles musik
lglobal.@clientCurrentMusic = Navnet på det aktuelle musiknummer der afspilles, eller null

lenum.type = Type af bygning/enhed.\nf.eks. for enhver router vil dette returnere [accent]@router[].\nIkke en tekststreng.
lenum.shoot = Skyd mod en position.
lenum.shootp = Skyd mod en enhed/bygning med hastighedsforudsigelse.
lenum.config = Bygningskonfiguration, f.eks. sorteringsgenstand.
lenum.enabled = Om blokken er aktiveret.

