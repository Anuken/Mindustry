locales.info = Her kan du tilføje sprogpakker for specifikke sprog til dit kort. I sprogpakker har hver egenskab et navn og en værdi. Disse egenskaber kan bruges af verdensprocessorer og mål ved hjælp af deres navne. De understøtter tekstformatering (erstatning af pladsholdere med faktiske værdier).\n\n[cyan]Eksempel på egenskab:\n[]navn: [accent]timer[]\nværdi: [accent]Eksempel-timer, tid tilbage: {0}[]\n\n[cyan]Brug:\n[]Angiv det som målets tekst: [accent]@timer\n\n[]Udskriv det i en verdensprocessor:\n[accent]localeprint "timer"\nformat time\n[gray](hvor time er en separat beregnet variabel)
