lglobal.@thisy = Y-koordinat for blokken der udfører koden
lglobal.@links = Samlet antal blokke forbundet til denne processor
lglobal.@ipt = Processorens eksekveringshastighed i instruktioner pr. tick (60 ticks = 1 sekund)

lglobal.@unitCount = Samlet antal typer af enhedsindhold i spillet; bruges med opslagsinstruktionen
lglobal.@blockCount = Samlet antal typer af blokindhold i spillet; bruges med opslagsinstruktionen
lglobal.@itemCount = Samlet antal typer af genstandsindhold i spillet; bruges med opslagsinstruktionen
lglobal.@liquidCount = Samlet antal typer af væskeindhold i spillet; bruges med opslagsinstruktionen

