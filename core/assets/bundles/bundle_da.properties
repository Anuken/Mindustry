laccess.displayheight = Højde på en displayblok i pixels.
laccess.buffersize = Number of unprocessed commands in the graphics buffer of a display.
laccess.operations = Antal operationer udført på blokken.\nFor displays returneres antallet af drawflush-operationer.
laccess.maxunits = Maksimalt antal enheder et hold kan have.\nKan kun aflæses fra kerner.
laccess.totalitems = Samlet antal genstande indeholdt i denne bygning.
laccess.firstitem = Første indeholdte genstand, eller null hvis tom.
laccess.totalliquids = Samlet mængde væske indeholdt i denne bygning.
laccess.totalpower = Aktuelt lagret strøm i denne bygning.
laccess.itemcapacity = Maksimalt antal genstande denne bygning kan rumme.
laccess.liquidcapacity = Maksimal mængde væske denne bygning kan rumme.
laccess.powercapacity = Maksimal mængde strøm denne bygning kan lagre.
laccess.powernetstored = Aktuelt lagret strøm i det forbundne elnetværk.
laccess.powernetcapacity = Samlet strømkapacitet for det forbundne elnetværk.
laccess.powernetin = Aktuel strømindgang for det forbundne elnetværk i strøm/sek.
laccess.powernetout = Aktuelt strømforbrug for det forbundne elnetværk i strøm/sek.
laccess.ammo = Et tårns aktuelle ammunitionsmængde.
laccess.ammocapacity = Et tårns maksimale ammunitionskapacitet.
laccess.health = Helbredstilstand
laccess.maxhealth = Maksimalt helbred.\nFor projektiler: basisskade.
laccess.heat = Varmeniveau
laccess.shield = En enheds aktuelle skjoldmængde.
laccess.armor = Rustningsværdi; fast skadesreduktion pr. træffer.
laccess.efficiency = Arbejdseffektivitet
laccess.timescale = Tidsskala for denne bygning eller enhed.
laccess.rotation = Rotationsvinkel
laccess.x = X-koordinat
laccess.y = Y-koordinat
laccess.velocityx = En enheds X-hastighed i felter/sek.
laccess.velocityy = En enheds Y-hastighed i felter/sek.
laccess.shootx = X-koordinat en enhed eller et tårn sigter mod.
laccess.shooty = Y-koordinat en enhed eller et tårn sigter mod.
laccess.camerax = X-position for den styrende spillers kamera.
laccess.cameray = Y-position for den styrende spillers kamera.
