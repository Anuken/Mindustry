hint.skip = Spring over
hint.desktopMove = Brug [accent][[WASD][] til at bevæge dig.
hint.zoom = [accent]Rul[] for at zoome ind eller ud.
hint.desktopShoot = [accent][[Venstreklik][] for at skyde.
hint.depositItems = Træk fra dit skib til kernen for at overføre genstande.
hint.respawn = For at genopstå som skib, tryk på [accent][[V][].
hint.respawn.mobile = Du har overført styringen til en enhed/bygning. For at genopstå som skib, [accent]tryk på avataren i øverste venstre hjørne.[]
hint.desktopPause = Tryk på [accent][[Mellemrum][] for at sætte spillet på pause eller genoptage det.
hint.breaking = [accent]Højreklik[] og træk for at nedbryde blokke.
hint.breaking.mobile = Aktivér :hammer: [accent]hammeren[] i nederste højre hjørne og tryk for at fjerne blokke.\n\nHold fingeren nede i et sekund og træk for at fjerne inden for en markering.
hint.blockInfo = View information of a block by selecting it in the [accent]build menu[], then selecting the [accent][[?][] button at the right.
hint.derelict = [accent]Derelict[] structures are broken remnants of old bases that no longer function.\n\nThese structures can be [accent]deconstructed[] for resources.
hint.research = Brug :tree: [accent]Forskning[]-knappen til at udforske ny teknologi.
hint.research.mobile = Brug :tree: [accent]Forskning[]-knappen i :menu: [accent]Menuen[] til at udforske ny teknologi.
hint.unitControl = Hold [accent][[L-ctrl][] and [accent]click[] to control friendly units or turrets.
hint.unitControl.mobile = [accent][[Double-tap][] to control friendly units or turrets.
hint.unitSelectControl = For at styre enheder, gå i [accent]kommandotilstand[] ved at holde [accent]V-Shift[] nede.\nI kommandotilstand kan du klikke og trække for at vælge enheder. [accent]Højreklik[] på en placering eller et mål for at beordre enheder derhen.
hint.unitSelectControl.mobile = For at styre enheder, gå i [accent]kommandotilstand[] ved at trykke på [accent]kommando[]-knappen i nederste venstre hjørne.\nI kommandotilstand kan du holde fingeren nede og trække for at vælge enheder. Tryk på en placering eller et mål for at beordre enheder derhen.
hint.launch = Once enough resources are collected, you can [accent]Launch[] by selecting nearby sectors from the :map: [accent]Map[] in the bottom right.
hint.launch.mobile = Når nok ressourcer er indsamlet, kan du [accent]Opsende[] ved at vælge nærliggende sektorer fra :map: [accent]Kortet[] i :menu: [accent]Menuen[].
hint.schematicSelect = Hold [accent][[F][] nede og træk for at vælge blokke til kopiering og indsættelse.\n\n[accent][[Midterklik][] for at kopiere en enkelt bloktype.
hint.rebuildSelect = Hold [accent][[B][] nede og træk for at vælge ødelagte byggeplaner.\nDette vil genopbygge dem automatisk.
hint.rebuildSelect.mobile = Vælg :copy: kopier-knappen, tryk derefter på :wrench: genopbyg-knappen og træk for at vælge ødelagte planer.\nDette vil genopbygge dem automatisk.
hint.conveyorPathfind = Hold [accent][[V-Ctrl][] nede mens du trækker transportbånd for automatisk at finde en rute.
hint.conveyorPathfind.mobile = Aktivér :diagonal: [accent]diagonaltilstand[] og træk transportbånd for automatisk at finde en rute.
hint.boost = Hold [accent][[V-Shift][] for at flyve over forhindringer med din nuværende enhed.\n\nKun få landenheder har boostere.
hint.payloadPickup = Tryk på [accent][[[] for at samle små blokke eller enheder op.
hint.payloadPickup.mobile = [accent]Tryk og hold[] på en lille blok eller enhed for at samle den op.
hint.payloadDrop = Tryk på [accent]][] for at aflevere en nyttelast.
hint.payloadDrop.mobile = [accent]Tryk og hold[] på en tom position for at aflevere en nyttelast der.
hint.waveFire = [accent]Wave[]-tårne med vand som ammunition slukker automatisk brande i nærheden.
hint.guardian = [accent]Vogter[]-enheder er pansrede. Svag ammunition som [accent]Kobber[] og [accent]Bly[] er [scarlet]ikke effektivt[].\n\nBrug tårne af højere rang eller :graphite: [accent]Grafit[]-ammunition i :duo:Duo/:salvo:Salvo for at nedkæmpe vogtere.
hint.coreUpgrade = Kerner kan opgraderes ved at [accent]placere kerner af højere niveau over dem[].\n\nPlacér en :core-foundation: [accent]Fundament[]-kerne oven på :core-shard: [accent]Splint[]-kernen. Sørg for, at den er fri for forhindringer i nærheden.
hint.serpuloCoreZone = Additional cores may be constructed on :core-zone: [accent]Core Zone[] tiles.
hint.cannotUpgrade = Et [red]:tree:[]-ikon over en nyttelastenhed indikerer, at den opgraderede version ikke er udforsket endnu.\n\nEnhedsopgraderinger skal udforskes i [accent]:tree: teknologitræet[], før de kan fremstilles i ombyggere.
hint.presetLaunch = Grå [accent]landingszonesektorer[], såsom [accent]Frossen Skov[], kan opsendes til hvor som helst fra. De kræver ikke erobring af nærliggende territorium.\n\n[accent]Nummererede sektorer[], som denne, er [accent]valgfrie[].
hint.presetDifficulty = Denne sektor har et [scarlet]højt fjendtligt trusselsniveau[].\nOpsendelse til sådanne sektorer [accent]anbefales ikke[] uden passende teknologi og forberedelse.
hint.coreIncinerate = Når kernen er fuld for en given genstandstype, vil overskydende genstande af denne type blive [accent]forbrændt[].
hint.factoryControl = For at vælge en enhedsfabriks [accent]outputdestination[], klik på fabrikken i kommandotilstand, og højreklik derefter på en position.\nEnheder produceret af den vil automatisk bevæge sig derhen.
hint.factoryControl.mobile = For at vælge en enhedsfabriks [accent]outputdestination[], tryk på fabrikken i kommandotilstand, og tryk derefter på en position.\nEnheder produceret af den vil automatisk bevæge sig derhen.

gz.mine = Bevæg dig tæt på :ore-copper: [accent]kobbermalm[] på jorden og klik for at begynde minedrift.
gz.mine.mobile = Bevæg dig tæt på :ore-copper: [accent]kobbermalm[] på jorden og tryk på den for at begynde minedrift.
gz.research = Open the :tree: tech tree.\nResearch the :mechanical-drill: [accent]Mechanical Drill[], then select it from the menu in the bottom right.\nClick on a copper patch to place it.
gz.research.mobile = Open the :tree: tech tree.\nResearch the :mechanical-drill: [accent]Mechanical Drill[], then select it from the menu in the bottom right.\nTap on a copper patch to place it.\n\nPress the \ue800 [accent]checkmark[] at the bottom right to confirm.
gz.conveyors = Udforsk og placér :conveyor: [accent]transportbånd[] for at flytte de udvundne ressourcer\nfra bor til kernen.\n\nKlik og træk for at placere flere transportbånd.\n[accent]Rul[] for at rotere.
gz.conveyors.mobile = Udforsk og placér :conveyor: [accent]transportbånd[] for at flytte de udvundne ressourcer\nfra bor til kernen.\n\nHold fingeren nede i et sekund og træk for at placere flere transportbånd.
gz.drills = Udvid minedriften.\nPlacér flere mekaniske bor.\nUdvind 100 kobber.
gz.lead = :lead: [accent]Bly[] er en anden almindeligt anvendt ressource.\nOpsæt bor for at udvinde bly.
gz.moveup = :up: Gå op for yderligere målsætninger.
gz.turrets = Research and place 2 :duo: [accent]Duo[] turrets to defend the core.\nDuo turrets require \uf838 [accent]ammo[] from conveyors.
gz.duoammo = Supply the Duo turrets with [accent]copper[], using conveyors.
gz.walls = [accent]Mure[] kan forhindre indkommende skade i at nå bygninger.\nPlacer :copper-wall: [accent]kobbermure[] omkring tårnene.
gz.defend = Fjender på vej, gør klar til forsvar.
gz.aa = Flyvende enheder kan ikke let nedkæmpes med standardtårne.\n:scatter: [accent]Scatter[]-tårne giver fremragende luftforsvar, men kræver :lead: [accent]bly[] som ammunition.
gz.scatterammo = Supply the Scatter turret with [accent]lead[], using conveyors.
gz.supplyturret = [accent]Forsyn tårn
gz.zone1 = Dette er fjendens nedkastningszone.
gz.zone2 = Alt bygget inden for radius ødelægges, når en bølge starter.
gz.zone3 = En bølge begynder nu.\nGør dig klar.
gz.finish = Byg flere tårne, udvind flere ressourcer,\nog forsvar mod alle bølger for at [accent]erobre sektoren[].

ff.coal = Brug :mechanical-drill: [accent]Mekaniske Bor[] til at udvinde :ore-coal: [accent]kul[].
ff.graphitepress = :tree: Udforsk og placér en :graphite-press: [accent]Grafitpresse[].
ff.craft = Flyt :coal: kul ind i :graphite-press: [accent]Grafitpressen[].\nDen vil udsende :graphite: grafit til alle nærliggende transportbånd.\nFlyt den fremstillede :graphite: grafit fra :graphite-press: [accent]Grafitpressen[] ind i kernen.
ff.generator = :coal: Kul kan også bruges som brændstof i :combustion-generator: [accent]forbrændingsgeneratorer[].\nUdforsk og placer en :combustion-generator: [accent]forbrændingsgenerator[].
ff.coalpower = Tilfør :coal: kul til generatoren for at producere [accent]:power: strøm[].
ff.coalpower.objective = :combustion-generator: Producer strøm
ff.node = :power-node: [accent]Strømnoder[] overfører strøm til nærliggende blokke inden for rækkevidde.\nUdforsk og placer en :power-node: [accent]strømnode[] tæt på generatoren.
ff.battery = :battery: [accent]Batterier[] lagrer strøm.\nUdforsk og placér et :battery: [accent]Batteri[] tæt på knudepunktet.
ff.arc = :arc: [accent]Arc[]-tårne kræver strøm for at fungere. Udforsk og placér et :arc: [accent]Arc[]-tårn nær et strømknudepunkt.

fungalpass.tutorial1 = Brug [accent]enheder[] til at forsvare bygninger og angribe fjenden.\nUdforsk og placér en :ground-factory: [accent]landfabrik[].
fungalpass.tutorial2 = Vælg :dagger: [accent]Dagger[]-enheder på fabrikken.\nFremstil 3 enheder.

frontier.tutorial1 = The :additive-reconstructor: [accent]Additive Reconstructor[]\nupgrades tier 1 units to tier 2\nusing :silicon: silicon and :graphite: graphite.\n\n[accent]Research and reconstruct\na []:dagger:[accent] dagger to a []:mace:[accent] mace.
frontier.tutorial2 = Fjendtlige bølger fortsætter [accent]uendeligt[], indtil alle fjendtlige kerner er [unlaunched]ødelagt.
frontier.tutorial3 = [accent]Angrib den fjendtlige base hurtigt for at forhindre, at bølgerne bliver for svære[].

atolls.destroy1 = Ødelæg de 2 fjendtlige [accent]fundamentskerner[] først.\n[accent]Få adgang til thorium[].
atolls.mega1 = Gå i [accent]kommandotilstand[] og vælg :mega:[accent]Mega[]-enhederne.
atolls.mega2 = Select the \ue87b [accent]Load Units[] command to have Mega units to pick up ground units.
atolls.mega3 = Flyt Mega-enhederne [accent]hen over[] landenheder for at laste dem.
atolls.mega4 = [accent]Kast landenheder ned her for at angribe.
atolls.mega5 = Select the \ue879 [accent]Unload Payload[] command to have Mega units drop their carried units.
atolls.mega6 = Units will be [accent]automatically dropped[] while the \ue879 Unload Payload command is selected.
atolls.mega7 = Mega-enheder [accent]vil ikke[] kaste landenheder ned, mens de er over mure eller dybt vand.
atolls.mega8 = [accent]Kast flådeenheder ned her for at angribe.[]
atolls.attack1 = 1: Kast landenheder ned her for at angribe fra denne position.
atolls.attack2 = 2: Alternativt kan du kaste flådeenheder ned her for at iværksætte et overraskelsesangreb.
atolls.carry1 = Transport af landenheder kræver :mega:[accent]Mega[]-enheder.
atolls.carry2 = 1: Beordr Mega-enheder til at [accent]bevæge sig hen over[] landenhederne.
atolls.carry3 = 2: Select the \ue87b [accent]Load Units[] command in order to pick up the ground units with the Mega units.
atolls.carry4 = 3: Styr og flyt Mega-transportørerne [accent]lastet med enheder[].
atolls.carry5 = 4: Select the \ue879 [accent]'Unload Payload'[] command in order for the Mega units to drop the ground units.
atolls.carry6 = Disse trin kan gennemses [accent]her[].
atolls.carry7 = Følg disse instruktioner for at nedkaste flere enheder nær den fjendtlige base.
atolls.noairunit = Denne base er for stærkt befæstet til at blive ødelagt med luftenheder.
atolls.2strategies = Der er to strategier til at ødelægge denne base.

onset.mine = Klik for at udvinde :beryllium: [accent]beryllium[] fra klippevægge.\n\nBrug [accent][[WASD] til at bevæge dig.
onset.mine.mobile = Tryk for at udvinde :beryllium: [accent]beryllium[] fra klippevægge.
onset.research = Åbn :tree: teknologitræet.\nUdforsk og placér derefter en :turbine-condenser: [accent]turbinekondensator[] på ventilationsåbningen.\nDette vil generere [accent]strøm[].
onset.bore = Udforsk og placér et :plasma-bore: [accent]plasmabor[].\nDette udvinder automatisk ressourcer fra klippevægge.
onset.power = For at tilføre [accent]strøm[] til plasmaboret, udforsk og placér et :beam-node: [accent]stråleknudepunkt[].\nForbind turbinekondensatoren til plasmaboret.
onset.ducts = Udforsk og placér :duct: [accent]kanaler[] for at flytte de udvundne ressourcer fra plasmaboret til kernen.\nKlik og træk for at placere flere kanaler.\n[accent]Rul[] for at rotere.
onset.ducts.mobile = Udforsk og placér :duct: [accent]kanaler[] for at flytte de udvundne ressourcer fra plasmaboret til kernen.\n\nHold fingeren nede i et sekund og træk for at placere flere kanaler.
onset.moremine = Udvid minedriften.\nPlacér flere plasmabor og brug stråleknudepunkter og kanaler til at understøtte dem.\nUdvind 200 beryllium.
onset.graphite = Mere komplekse blokke kræver :graphite: [accent]grafit[].\nOpsæt plasmabor til at udvinde grafit.
onset.research2 = Begynd at udforske [accent]fabrikker[].\nUdforsk :cliff-crusher: [accent]klippeknuseren[] og :silicon-arc-furnace: [accent]siliciumlysbueovnen[].
onset.arcfurnace = Lysbueovnen kræver :sand: [accent]sand[] og :graphite: [accent]grafit[] for at fremstille :silicon: [accent]silicium[].\n[accent]Strøm[] er også påkrævet.
onset.crusher = Brug :cliff-crusher: [accent]klippeknusere[] til at udvinde sand.
onset.fabricator = Brug [accent]enheder[] til at udforske kortet, forsvare bygninger og angribe fjenden. Udforsk og placér en :tank-fabricator: [accent]kampvognsfremstiller[].
onset.makeunit = Fremstil en enhed.\nBrug "?"-knappen for at se den valgte fabriks krav.
onset.turrets = Enheder er effektive, men [accent]tårne[] giver bedre forsvarskapacitet, hvis de bruges rigtigt.\nPlacer et :breach: [accent]Breach[]-tårn.\nTårne kræver :beryllium: [accent]ammunition[].
onset.turretammo = Supply the turret with [accent]beryllium ammo.[]
onset.walls = [accent]Mure[] kan forhindre indkommende skade i at nå bygninger.\nPlacer nogle :beryllium-wall: [accent]berylliummure[] omkring tårnet.
onset.enemies = Fjender på vej, gør klar til forsvar.
onset.defenses = [accent]Opsæt forsvar:[lightgray] {0}
onset.attack = Fjenden er sårbar. Gå til modangreb.
onset.cores = Nye kerner kan placeres på [accent]kernefelter[].\nNye kerner fungerer som fremskudte baser og deler ressourcelager med andre kerner.\nPlacér en :core-bastion: kerne.
onset.detect = The enemy will be able to detect you in 2 minutes.\nSet up defenses, mining, and production.
onset.commandmode = Hold [accent]Shift[] nede for at gå i [accent]kommandotilstand[].\n[accent]Venstreklik og træk[] for at vælge enheder.\n[accent]Højreklik[] for at beordre valgte enheder til at bevæge sig eller angribe.
onset.commandmode.mobile = Tryk på [accent]kommandoknappen[] for at gå i [accent]kommandotilstand[].\nHold en finger nede, og [accent]træk[] for at vælge enheder.\n[accent]Tryk[] for at beordre valgte enheder til at bevæge sig eller angribe.
aegis.tungsten = Wolfram kan udvindes ved hjælp af et [accent]slagbor[].\nDenne bygning kræver [accent]vand[] og [accent]strøm[].

split.pickup = Some blocks can be picked up by the core unit.\nPick up this [accent]container[] and place it onto the [accent]payload loader[].\n(Default keys are [ and ] to pick up and drop)
split.pickup.mobile = Some blocks can be picked up by the core unit.\nPick up this [accent]container[] and place it onto the [accent]payload loader[].\n(To pick up or drop something, long-press it.)
split.acquire = You must acquire some tungsten to build units.
split.build = Units must be transported to the other side of the wall.\nPlace two [accent]Payload Mass Drivers[], one on each side of the wall.\nSet up the link by pressing one of them, then selecting the other.
split.container = Similar to the container, units can also be transported using a [accent]Payload Mass Driver[].\nPlace a unit fabricator adjacent to a mass driver to load them, then send them across the wall to attack the enemy base.

item.copper.description = Det simpleste byggemateriale. Bruges i store mængder til næsten alle typer af blokke.
item.copper.details = Kobber. Usædvanligt udbredt metal på Serpulo. Strukturelt svagt medmindre det forstærkes.
item.lead.description = Et grundlæggende materiale. Har bred anvendelse inden for elektronik og rørlægning.
item.lead.details = Dense. Inert. Extensively used in batteries.\nNote: Likely toxic to biological life forms. Not that there are many left here.
item.metaglass.description = Et super-stærkt gennemsigtigt materiale. Bruges meget til transport og lagring af væsker.
item.graphite.description = Mineraliseret kul, som bruges til elektronik og ammunition.
item.sand.description = Et almindeligt materiale, der anvendes i enorme mængder til smelteprocesser.
item.coal.description = Fossilt plantestof, fra arter der groede lang tid før svampesporerne opstod. Har bred anvendelse som brændstof, og til at producere avancerede materialer.
item.coal.details = Ligner fossiliseret plantemateriale, dannet længe før udsædshændelsen.
item.titanium.description = Et sjældent metal med meget lav vægt, som har bred anvendelse inden for væsketransport og luftfart.
item.thorium.description = Et radioaktivt materiale med høj massefylde som bruges til hærdede bygninger og som kernebrændstof.
item.scrap.description = Forglemte rester af gamle strukturer. Indeholder spor af mange forskellige materialer.
item.scrap.details = Efterladte rester fra gamle strukturer og enheder.
item.silicon.description = Ekstremt nyttig som halvleder. Anvendelse inden for solpaneler, avanceret elektronik og målsøgende ammunition.
item.plastanium.description = Et let, smidigt metal som anvendes til avancerede strukturer og som fragmenterende ammunition.
item.phase-fabric.description = En næsten vægtløs substans der anvendes til avanceret elektronik og selvreparerende teknologi.
item.surge-alloy.description = En avanceret legering med unikke elektriske egenskaber.
item.spore-pod.description = En bælg af økologiske svampesporer, kultiveret til industribrug fra atmosfæriske partikler. Kan omdannes til olie eller sprængstoffer, og bruges til brændstof.
item.spore-pod.details = Sporer. Sandsynligvis en syntetisk livsform. Udleder giftige gasser til andet biologisk liv. Ekstremt invasiv. Meget brandfarlig under visse forhold.
item.blast-compound.description = En ustabil kemisk forbindelse der bruges til bomber og andre eksplosiver. Dannes fra svampesporer og andre brændfarlige substanser. Bør ikke anvendes som brændstof.
item.pyratite.description = En ekstremt brændfarlig substans der primært er til våbenbrug.

#Erekir
item.beryllium.description = Anvendes som et grundlæggende byggemateriale på Erekir. Bruges i konstruktion og fremstilling af lette enheder.
item.tungsten.description = Bruges i bor, pansring og ammunition. Kræves til konstruktion af mere avancerede strukturer.
item.oxide.description = Bruges som isolator og varmeafledende komponent i avancerede Erekir-strukturer.
item.carbide.description = En ekstremt hård legering. Bruges i tunge forsvarsværker, avanceret ammunition og pansrede enheder.

liquid.water.description = En meget nyttig væske. Bruges ofte til køling, og til at skylle affaldsstoffer væk.
liquid.slag.description = Smeltede metaller af forskellig art. Stofferne det består af kan udvindes, eller det kan sprøjtes over fjenden som et våben.
liquid.oil.description = Væsken bruges til at producere avancerede materialer. Kan også omdannes til kul, og kan desuden sprøjtes over fjenden og antendes som et våben.
liquid.cryofluid.description = En kemisk inaktiv væske der ikke forårsager rust, som er dannet fra vand og titanium. Dens høje varmekapacitet gør den egnet som køling.

#Erekir
liquid.arkycite.description = Bruges i kemiske reaktioner til strømproduktion og materialesyntese.
liquid.ozone.description = Used as an oxidizing agent in material production, and as fuel. Moderately explosive.
liquid.hydrogen.description = Bruges i ressourceudvinding, enhedsproduktion og bygningsreparation. Brandfarligt.
liquid.cyanogen.description = Bruges til ammunition, konstruktion af avancerede enheder og forskellige reaktioner i avancerede blokke. Meget brandfarligt.
liquid.nitrogen.description = Bruges i ressourceudvinding, gasskabelse og enhedsproduktion. Inert.
liquid.neoplasm.description = Et farligt biologisk biprodukt fra Neoplasia-reaktoren. Spreder sig hurtigt til tilstødende vandholdige blokke og beskadiger dem. Tyktflydende.
liquid.neoplasm.details = Neoplasma. En ukontrollerbar masse af hurtigt delende syntetiske celler med en slamagtig konsistens. Varmebestandig. Ekstremt farlig for alle strukturer, der involverer vand.\n\nFor kompleks og ustabil til standardanalyse. Potentielle anvendelser ukendte. Destruktion i slaggebassiner anbefales.

block.derelict = \uf77e [lightgray]Derelict
block.armored-conveyor.description = Pansret transportbånd der forhindrer sidelæns indføring og beskytter mod skade.
block.illuminator.description = A small, compact, configurable light source. Requires power to function.
block.message.description = Gemmer og viser en tekstbesked til spillere.
block.reinforced-message.description = Gemmer en besked til kommunikation mellem allierede.
block.world-message.description = En meddelelsesblok til brug i kortfremstilling. Kan ikke ødelægges.
block.world-processor.description = En processor til brug i kortfremstilling. Kan ikke ødelægges. Er i stand til at bruge privilegerede instruktioner, såsom at frembringe enheder eller ændre felter.
block.world-cell.description = En hukommelsescelle til brug i kortfremstilling. Kan ikke ødelægges.
block.world-switch.description = En omskifterblok til brug i kortfremstilling. Kan ikke ødelægges. Kan kun betjenes af spillere på samme hold.
block.shield-projector.description = En uforgængelig skjoldprojektor til brug i kortfremstilling.
block.large-shield-projector.description = En uforgængelig skjoldprojektor til brug i kortfremstilling.
block.graphite-press.description = Presser kulstykker sammen til ark af ren grafit.
block.multi-press.description = En opgraderet version af kul-valsen. Bruger vand og strøm til hurtigere at prodcere en større mængde grafit per kulstykke.
block.silicon-smelter.description = Smelter sand og kul sammen til silicium, et afgørende materiale til elektronik og enheder.
block.kiln.description = Brænder sand og bly sammen til metaglas til væskehåndtering.
block.plastanium-compressor.description = Komprimerer olie og titanium til plastanium.
block.phase-weaver.description = Væver thorium og sand sammen til fasestof.
block.surge-smelter.description = Kombinerer kobber, bly, titanium og silicium til en stærk overspændingslegering.
block.cryofluid-mixer.description = Blander titanium og vand til en effektiv kølevæske.
block.blast-mixer.description = Kombinerer pyratit og sporepresset materiale til kraftigt eksplosivt sprængstof.
block.pyratite-mixer.description = Blander kul, bly og sand til brandfarligt pyratit.
block.melter.description = Smelter malm og mineraler til flydende slagger ved høj varme.
block.separator.description = Separerer indholdet i ildgrød til underliggende mineraler. Udleder det kølede resultat.
block.spore-press.description = Komprimerer svampesporer til olie under ekstremt pres.
block.pulverizer.description = Kværner skrot til fint sand.
block.coal-centrifuge.description = Omdanner olie til klumper af kul.
block.incinerator.description = Tilintetgører alle genstande eller væsker, der transporteres ind i den.
block.power-void.description = Opsluger alt strøm, der forbindes til den. Kun i sandkassen.
block.power-source.description = Uendelige mængder af strøm. Kun i sandkassen.
block.item-source.description = Udsteder uendelige mængder af genstande. Kun i sandkassen.
block.item-void.description = Destruerer enhver genstand. Kun i sandkassen.
block.liquid-source.description = Udsteder uendelige mængder af væske. Kun i sandkassen.
block.liquid-void.description = Fjerner enhver væske. Kun i sandkassen.
block.payload-source.description = Udsender uendeligt nyttelast. Kun til sandkasse.
block.payload-void.description = Destruerer al nyttelast. Kun til sandkasse.
block.copper-wall.description = En simpel forsvarsmur lavet af kobber. Beskytter mod fjendtlig ild.
block.copper-wall-large.description = En stor forsvarsmur lavet af kobber. Giver øget beskyttelse over et større område.
block.titanium-wall.description = En stærk forsvarsmur lavet af titanium. Beskytter effektivt mod mellemsvære angreb.
block.titanium-wall-large.description = En stor, stærk forsvarsmur lavet af titanium. Ideel til frontline-forsvar.
block.plastanium-wall.description = En unik type væg, der absorberer strøm-kiler og blokerer automatiske strøm-forbindelser.
block.plastanium-wall-large.description = En unik type væg, der absorberer strøm-kiler og blokerer automatiske strøm-forbindelser.\nFylder flere felter.
block.thorium-wall.description = En meget stærk forsvarsmur lavet af thorium. Giver fremragende beskyttelse.
block.thorium-wall-large.description = En stor og ekstremt robust forsvarsmur af thorium. Modstår kraftig beskydning.
block.phase-wall.description = En avanceret mur der reflekterer de fleste indkommende projektiler.
block.phase-wall-large.description = En stor avanceret mur der reflekterer de fleste indkommende projektiler.
block.surge-wall.description = En ekstremt holdbar mur der udlader stød ved fjendtlig beskydning.
block.surge-wall-large.description = En stor, ekstremt holdbar mur der udlader stød ved fjendtlig beskydning.
block.scrap-wall.description = Beskytter strukturer mod fjendtlige projektiler.
block.scrap-wall-large.description = Beskytter strukturer mod fjendtlige projektiler.
block.scrap-wall-huge.description = Beskytter strukturer mod fjendtlige projektiler.
block.scrap-wall-gigantic.description = Beskytter strukturer mod fjendtlige projektiler.
block.door.description = En bette dør. Kan åbnes og lukkes ved at trykke på den.
block.door-large.description = En stor dør. Kan åbnes og lukkes ved at trykke på den.\nFylder flere felter.
block.mender.description = Reparerer løbende blokke i nærheden. Hjælper til at holde forsvaret oppe mellem bølger.\nSilicium kan bruges til at øge rækkevidde og effektivitet.
block.mend-projector.description = En bedre version af den normale reparatør. Reparerer alle blokke inden for dens rækkevidde.\nFase-stof kan bruges til at øge dens rækkevidde og effektivitet.
block.overdrive-projector.description = Øger hastigheden af bygninger i nærheden.\nFase-stof kan bruges til at øge denne hastighed og rækkevidden af feltet.
block.force-projector.description = Skaber et stort, sekskantet kraftfelt, der beskytter bygninger og tropper.\nOveropheder, hvis den tager for meget skade. Kan nedkøles med væske. Fase-stof kan bruges til at gøre feltet større.
block.shock-mine.description = Skader fodgængere, der træder på den. Næsten usynlig for fjender.
block.conveyor.description = Transporterer genstande fremad. Grundlæggende element i fabriksautomatisering.
block.titanium-conveyor.description = Transporterer genstande betydeligt hurtigere end et standard transportbånd.
block.plastanium-conveyor.description = Transporterer genstande i bundter for maksimal kapacitet.
block.junction.description = Tillader to krydsende transportbånd at krydse hinanden uden at blande genstande.
block.bridge-conveyor.description = En avanceret genstands-transport-blok. Kan transportere over op til 3 felter, uanset om det er terræn eller blokke.
block.phase-conveyor.description = En avanceret genstands-transport-blok. Bruger strøm til at teleportere genstande til næste fase-bånd, hen over op til flere felter.
block.sorter.description = Sorterer genstande ud fra den valgte type.
block.inverted-sorter.description = Sorterer genstande omvendt i forhold til den valgte type.
block.router.description = Fordeler genstande ligeligt til tre tilstødende retninger.
block.router.details = Et nødvendigt onde. Brug ved siden af produktionsindgange frarådes, da de vil blive tilstoppet af output.
block.distributor.description = En stor router der fordeler genstande ligeligt til op til 7 retninger.
block.overflow-gate.description = Sender kun genstande til siderne hvis den primære vej er blokeret.
block.underflow-gate.description = Sender kun genstande fremad hvis siderne er blokerede.
block.mass-driver.description = Den ultimative transport-blok. Samler en masse genstande og slynger dem hovedkulds gennem luften til den kvante-katapult.
block.mechanical-pump.description = En hverdags-pumpe, der ikke engang kræver strøm.
block.rotary-pump.description = En drønhurtig pumpe. Pumper mere væske, kræver mere strøm.
block.impulse-pump.description = Den allerbedste pumpe.
block.conduit.description = Simpel væske-transport-blok. Transporterer væske fremad. Bruges sammen med pumper, eller i forlængelse af andre rør.
block.pulse-conduit.description = En avanceret væske-transport-blok. Transporterer væske hurtigere og opbevarer mere end normale rør.
block.plated-conduit.description = Transporterer væske lige så hurtigt som højhastigheds-rør. Kan ikke tage væske ind fra siderne.\nLækker mindre.
block.liquid-router.description = Tager væske fra en retning, og fordeler denne ligeligt mellem op til tre andre retninger. Brugbar, når der er behov for at splitte en rørledning op.
block.liquid-container.description = Opbevarer en betydelig mængde væske. Udsender til alle sider ligesom en væskerouter.
block.liquid-tank.description = Opbevarer store mængder af væske. Kan bruges som sikkerhedslager i tilfælde af underskud eller til at forsyne nedkøling i nødsituationer.
block.liquid-junction.description = Fungerer som en bro over krydsende rør. Brugbar i situationer, hvor der er tale om transport af forskellige væsker.
block.bridge-conduit.description = Avanceret væske-transport. Kan transportere væske over 3 felter uanset om det er terræn eller bygninger.
block.phase-conduit.description = Avanceret væske-transport. Bruger strøm til at transportere væske hen over flere blokke.
block.power-node.description = Leder strøm til forbundne strøm-noder. Noden enten modtager eller giver strøm til sidestående blokke.
block.power-node-large.description = En evanceret strøm-node, der har længere rækkevidde.
block.surge-tower.description = En strømforbindelse med ekstremt lang rækkevidde. Kan kun klare få forbindelser.
block.diode.description = Batteri-strøm kan ledes gennem denne ensrettede blok, men kun hvis den ene side har mere strøm end destinationen.
block.battery.description = Opbevarer overskydende strøm. Giver strøm ved underskud i strømnetværket.
block.battery-large.description = Opbevarer mere strøm end et normalt batteri.
block.combustion-generator.description = Genererer strøm ved at brænde brændbare materialer, såsom kul.
block.thermal-generator.description = Genererer strøm, når den placeres på naturlig varme.
block.steam-generator.description = En avanceret forbrændingsgenerator. Mere effektiv, men kræver vand til at lave damp.
block.differential-generator.description = Genererer store mængder strøm. Bruger temperaturforskellen mellem frysesaft og brændende pyratit til at lave strøm.
block.rtg-generator.description = En simpel, bæredygtig generator. Bruger varmen fra radioaktivt henfald til langsomt at generere strøm.
block.solar-panel.description = Giver en smule strøm fra solen.
block.solar-panel-large.description = En betydeligt bedre version af de normale solpaneler.
block.thorium-reactor.description = Genererer bemærkelsesværdige mængder strøm. Kræver konstant nedkøling. Vil eksplodere voldeligt uden den rette nedkøling. Strøm-output afhænger af hvor fuld den her.
block.impact-reactor.description = En avanceret reaktor, der producerer rigtig meget strøm. Det kræver meget strøm at sparke processen i gang.
block.mechanical-drill.description = Et billigt bor. Når placeret oven på resurser, udvinder det dem langsomt. Kan kun udvinde basale resurser.
block.pneumatic-drill.description = Et bedre bor, der kan udvinde titanium. Borer hurtigere end det mekaniske bor.
block.laser-drill.description = Kan bore meget hårdere og hurtigere, men kræver mere strøm. Kan udvide thorium.
block.blast-drill.description = Det ybberste bor. Kræver meget strøm.
block.water-extractor.description = Udvinder grundvand. Bruges i områder uden vand på overfladen.
block.cultivator.description = Kultiverer små mængder af økologiske svampesporer fra atmosfæren.
block.cultivator.details = Genfundet teknologi. Bruges til at producere massive mængder biomasse så effektivt som muligt. Sandsynligvis den oprindelige inkubator for de sporer, der nu dækker Serpulo.
block.oil-extractor.description = Bruger meget strøm, sand og vand for at udvinde olie.
block.core-shard.description = Den første kerne. Hvis den bliver ødelagt, taber du regionen. Ikke lad den blive ødelagt.
block.core-shard.details = Den første iteration. Kompakt. Selvreplikerende. Udstyret med engangs-opsendelsestændere. Ikke designet til interplanetarisk rejse.
block.core-foundation.description = Den anden overbygning til kernen. Mere pansret. Opbevarer flere ting.
block.core-foundation.details = Den anden iteration.
block.core-nucleus.description = Den tredje og største overbygning af kernen. Helt vildt pansret. Opbevarer kollosale mængder af ting.
block.core-nucleus.details = Den tredje og sidste iteration.
block.vault.description = Opbevarer en stor mængde ressourcer.
block.container.description = Opbevarer en moderat mængde af forskellige ressourcer.
block.unloader.description = Aflæsser genstande fra sidestående blokke. Typen af blok, der skal aflæsses kan justeres.
block.launch-pad.description = Affyrer samlinger af genstande løbende. Kræver ikke affyring af kernen.
block.advanced-launch-pad.description = Opsender partier af genstande til valgte sektorer. Accepterer kun én genstandstype ad gangen.
block.advanced-launch-pad.details = Sub-orbitalt system til punkt-til-punkt-transport af ressourcer.
block.landing-pad.description = Modtager genstande fra opsendelsesramper i andre sektorer. Kræver store mængder vand for at beskytte mod nedslagsstød.
block.duo.description = Et lille, simpelt dobbeltløbet tårn. Skyder mod land- og luftenheder.
block.scatter.description = Et anti-lufttårn der affyrer fragmenterende skud mod flyvende fjender.
block.scorch.description = En flammekaster der forårsager enorm skade på tæt hold. Kræver brændbart materiale.
block.hail.description = Et langtrækkende artilleritårn der affyrer projektiler i en bue mod fjendtlige landenheder.
block.wave.description = Et tårn der sprøjter væsker mod fjender. Nyttigt til slukning af ildebrande eller påføring af statusværk.
block.lancer.description = Et energitårn der oplader og affyrer en kraftig stråle af lyn mod landmål.
block.arc.description = Et kortrækkende energitårn der affyrer elektriske stød mod flere fjender på én gang.
block.swarmer.description = Et avanceret tårn der affyrer søgende raketter mod både land- og luftmål.
block.salvo.description = Et større og mere præcist tårn der affyrer hurtige salver af projektiler.
block.fuse.description = Et kortrækkende tårn der affyrer tre kraftige haglskud i en spredning.
block.ripple.description = Et tungt artilleritårn der affyrer klynger af projektiler over store afstande.
block.cyclone.description = Et tungt gatling-tårn der affyrer eksplosive skud med høj skudkadence.
block.spectre.description = Et massivt forsvars-gatlingtårn der gennemborer pansring med tunge projektiler.
block.meltdown.description = En massiv laser-kanon. Lader og affyrer storer laser-stråler mod svenskere. Kræver nedkøling for at virke.
block.foreshadow.description = Et enormt snigskyttetårn der affyrer superaccelererede projektiler mod de stærkeste fjender.
block.repair-point.description = Helbreder konstant den nærmeste enhed.
block.segment.description = Skader og ødelægger projektiler. Laser-projektiler gælder ikke her.
block.parallax.description = Udsender en trækkestråle, der trækker luftmål til sig og beskadiger dem i processen.
block.tsunami.description = Affyrer kraftige væskestråler mod fjender. Slukker automatisk brande, når den forsynes med vand.
block.silicon-crucible.description = Raffinerer silicium fra sand og kul ved at bruge pyratit som en ekstra varmekilde. Mere effektiv på varme placeringer.
block.disassembler.description = Adskiller slagger til små mængder eksotiske mineralkomponenter ved lav effektivitet. Kan producere thorium.
block.overdrive-dome.description = Increases the speed of nearby buildings. Requires phase fabric and silicon to operate.
block.payload-conveyor.description = Flytter store nyttelaster, såsom enheder fra fabrikker.
block.payload-router.description = Splits input payloads into 3 output directions.
block.ground-factory.description = Fremstiller grundlæggende landenheder.
block.air-factory.description = Fremstiller grundlæggende luftenheder.
block.naval-factory.description = Fremstiller grundlæggende flådeenheder.
block.additive-reconstructor.description = Opgraderer enheder til niveau 2.
block.multiplicative-reconstructor.description = Opgraderer enheder til niveau 3.
block.exponential-reconstructor.description = Opgraderer enheder til niveau 4.
block.tetrative-reconstructor.description = Opgraderer enheder til niveau 5.
block.switch.description = En omskifter. Tilstand kan aflæses og styres med logikprocessorer.
block.micro-processor.description = Kører logikinstruktioner i en løkke for at styre bygninger og enheder.
block.logic-processor.description = En hurtigere processor til komplekse logikprogrammer.
block.hyper-processor.description = Den hurtigste processor til ekstremt krævende logikberegninger.
block.memory-cell.description = Gemmer data til brug for logikprocessorer.
block.memory-bank.description = Gemmer en større mængde data til logikprocessorer.
block.logic-display.description = Viser grafik produceret af en logikprocessor.
block.large-logic-display.description = Et stort display til visning af grafik fra en logikprocessor.
block.tile-logic-display.description = Viser vilkårlig grafik fra en logikprocessor.\nForbinder sig problemfrit til nærliggende sammenkædede displayskærme.
block.interplanetary-accelerator.description = Et massivt elektromagnetisk railgun-tårn. Accelererer kerner til undvigelseshastighed for interplanetarisk indsættelse.
block.repair-turret.description = Reparerer kontinuerligt den nærmeste beskadigede enhed i sin nærhed. Accepterer valgfrit kølemiddel.
block.target-dummy.name = Målskive
block.target-dummy.description = Spawner en måldukke for at teste skade pr. sekund. Rustning og flyveevne kan konfigureres.\nKun sandkasse.

#Erekir
block.core-bastion.description = Basens kerne. Pansret. Hvis den ødelægges, er sektoren tabt.
block.core-citadel.description = Basens kerne. Meget velpansret. Gemmer flere ressourcer end en Bastion-kerne.
block.core-acropolis.description = Basens kerne. Ekstraordinært velpansret. Gemmer flere ressourcer end en Citadel-kerne.
block.breach.description = Fires piercing beryllium or tungsten ammunition at enemy targets.
block.diffuse.description = Fires a burst of bullets in a wide cone. Pushes enemy targets back.
block.sublimate.description = Udsender en kontinuerlig flammestråle mod fjendtlige mål. Gennemtrænger pansring.
block.titan.description = Fires a massive explosive artillery shell at ground targets. Requires hydrogen.
block.afflict.description = Fires a massive charged orb of fragmentary flak. Requires heating.
block.disperse.description = Affyrer salver af flak-skud mod luftmål.
block.lustre.description = Fires a slow-moving single-target laser at enemy targets.
block.scathe.description = Launches a powerful missile at ground targets over vast distances.
block.smite.description = Affyrer salver af gennemtrængende, lynudladende projektiler.
block.malign.description = Affyrer en byge af søgende laserladninger mod fjendtlige mål. Kræver omfattende opvarmning.
block.silicon-arc-furnace.description = Smelter sand og grafit om til silicium via en elektrisk lysbue.
block.oxidation-chamber.description = Producerer oxid ved at oxidere beryllium med ozon.
block.electric-heater.description = Heats facing blocks. Requires large amounts of power.
block.slag-heater.description = Heats facing blocks. Requires slag.
block.phase-heater.description = Heats facing blocks. Requires phase fabric.
block.heat-redirector.description = Omdirigerer akkumuleret varme til andre blokke.
block.small-heat-redirector.description = Omdirigerer akkumuleret varme til andre blokke.
block.heat-router.description = Fordeler akkumuleret varme i tre udgangsretninger.
block.electrolyzer.description = Converts water into hydrogen and ozone gas.
block.atmospheric-concentrator.description = Koncentrerer kvælstof fra atmosfæren. Kræver varme.
block.surge-crucible.description = Fremstiller overspændingslegering under ekstreme trykforhold.
block.phase-synthesizer.description = Syntetiserer fasestof fra thorium, sand og ozon. Kræver varme.
block.carbide-crucible.description = Fremstiller karbid ved høj varme og tryk fra grafit og wolfram.
block.cyanogen-synthesizer.description = Syntetiserer cyanogen fra arkycit og grafit. Kræver varme.
block.slag-incinerator.description = Forbrænder ikke-flygtige genstande eller væsker. Kræver slagger.
block.vent-condenser.description = Kondenserer ventilationsgasser til vand. Forbruger strøm.
block.plasma-bore.description = Borer i malmårer ved hjælp af plasma. Kræver strøm og udleder varme.
block.large-plasma-bore.description = En stor plasmabor der dækker et større område med højere effektivitet.
block.cliff-crusher.description = Knuser klippevægge og udsender sand uendeligt. Kræver strøm. Effektivitet varierer afhængigt af klippetype.
block.large-cliff-crusher.description = Crushes walls, outputting sand indefinitely. Requires power and ozone. Efficiency varies based on type of wall. Optionally consumes tungsten to increase efficiency.
block.impact-drill.description = Udvinder beryllium og andre hårde mineraler ved kraftige stød.
block.eruption-drill.description = En massiv udvinningsboremaskine til dybe mineralårer. Kræver brint og afkøling.
block.reinforced-conduit.description = Flytter væsker fremad. Accepterer ikke ikke-rørforbindelser fra siderne.
block.reinforced-liquid-router.description = Fordeler væsker ligeligt til alle sider.
block.reinforced-liquid-tank.description = Opbevarer en stor mængde væske.
block.reinforced-liquid-container.description = Opbevarer en betydelig mængde væske.
block.reinforced-bridge-conduit.description = Transporterer væsker over strukturer og terræn.
block.reinforced-pump.description = Pumper og udsender væsker. Kræver brint.
block.beryllium-wall.description = Beskytter strukturer mod fjendtlige projektiler.
block.beryllium-wall-large.description = Beskytter strukturer mod fjendtlige projektiler.
block.tungsten-wall.description = Beskytter strukturer mod fjendtlige projektiler.
block.tungsten-wall-large.description = Beskytter strukturer mod fjendtlige projektiler.
block.carbide-wall.description = Beskytter strukturer mod fjendtlige projektiler.
block.carbide-wall-large.description = Beskytter strukturer mod fjendtlige projektiler.
block.reinforced-surge-wall.description = Protects structures from enemy projectiles, periodically launching electric arcs upon projectile contact.
block.reinforced-surge-wall-large.description = Protects structures from enemy projectiles, periodically launching electric arcs upon projectile contact.
block.shielded-wall.description = Protects structures from enemy projectiles. Deploys a shield that absorbs most projectiles when power is provided. Conducts power.
block.blast-door.description = En mur, der åbner sig, når allierede landenheder er inden for rækkevidde. Kan ikke styres manuelt.
block.duct.description = Transporterer genstande fremad i forseglede rør på Erekir.
block.armored-duct.description = Pansret rør der beskytter mod eksterne skader og forhindrer ukorrekt indføring.
block.duct-router.description = Fordeler genstande fra et rør ligeligt til flere retninger.
block.overflow-duct.description = Sender kun genstande til siderne, hvis den fremadrettede rute er blokeret.
block.duct-bridge.description = Krydser rør over forhindringer eller andre rørledninger.
block.duct-unloader.description = Aflæsser den valgte genstand fra blokken bagved. Kan ikke aflæsse fra kerner.
block.underflow-duct.description = Det modsatte af en overløbskanal. Sender genstande fremad, hvis venstre og højre rute er blokeret.
block.reinforced-liquid-junction.description = Fungerer som et kryds mellem to krydsende væskerør.
block.surge-conveyor.description = Flytter genstande i partier. Kan gøres hurtigere med strøm. Leder strøm.
block.surge-router.description = Fordeler genstande ligeligt i tre retninger fra overspændingstransportbånd. Kan gøres hurtigere med strøm. Leder strøm.
block.unit-cargo-loader.description = Konstruerer fragtdroner. Droner fordeler automatisk genstande til fragtaflæsningspunkter med et matchende filter.
block.unit-cargo-unload-point.description = Fungerer som aflæsningspunkt for fragtdroner. Modtager genstande, der matcher det valgte filter.
block.beam-node.description = Overfører strøm vinkelret til andre blokke. Gemmer en lille mængde strøm.
block.beam-tower.description = Overfører strøm vinkelret til andre blokke. Gemmer en stor mængde strøm. Langtrækkende.
block.beam-link.description = Overfører strøm over store afstande.\nKan kun forbindes til tilstødende strukturer eller andre strålelinks.
block.turbine-condenser.description = Genererer strøm, når den placeres på ventilationsåbninger. Producerer en lille mængde vand.
block.chemical-combustion-chamber.description = Genererer strøm fra arkycit og ozon.
block.pyrolysis-generator.description = Genererer store mængder strøm fra arkycit og slagger. Producerer vand som biprodukt.
block.flux-reactor.description = Genererer store mængder strøm, når den opvarmes. Kræver cyanogen som stabilisator. Strømoutput og cyanogenkrav er proportionale med varmetilførslen.\nEksploderer, hvis der ikke tilføres tilstrækkeligt cyanogen.
block.neoplasia-reactor.description = Bruger arkycit, vand og fasestof til at generere enorme mængder strøm. Producerer varme og farlig neoplasma som biprodukt.\nEksploderer voldsomt, hvis neoplasma ikke fjernes fra reaktoren via rørledninger.
block.build-tower.description = Genopbygger automatisk strukturer inden for rækkevidde og assisterer andre enheder med konstruktion.
block.regen-projector.description = Slowly repairs allied structures in a square perimeter. Requires hydrogen.
block.reinforced-container.description = Opbevarer en mindre mængde genstande. Indhold kan hentes via tømmere. Forøger ikke kernens lagerkapacitet.
block.reinforced-vault.description = Opbevarer en stor mængde genstande. Indhold kan hentes via tømmere. Forøger ikke kernens lagerkapacitet.
block.tank-fabricator.description = Konstruerer Stell-enheder. Fremstillede enheder kan bruges direkte eller sendes videre til ombyggere for opgradering.
block.ship-fabricator.description = Konstruerer Elude-enheder. Fremstillede enheder kan bruges direkte eller sendes videre til ombyggere for opgradering.
block.mech-fabricator.description = Konstruerer Merui-enheder. Fremstillede enheder kan bruges direkte eller sendes videre til ombyggere for opgradering.
block.tank-assembler.description = Samler store kampvogne ud fra inputblokke og enheder. Outputniveau kan øges ved at tilføje moduler.
block.ship-assembler.description = Samler store skibe ud fra inputblokke og enheder. Outputniveau kan øges ved at tilføje moduler.
block.mech-assembler.description = Samler store mechs ud fra inputblokke og enheder. Outputniveau kan øges ved at tilføje moduler.
block.tank-refabricator.description = Opgraderer indsatte kampvognsenheder til niveau 2.
block.ship-refabricator.description = Opgraderer indsatte skibsenheder til niveau 2.
block.mech-refabricator.description = Opgraderer indsatte mech-enheder til niveau 2.
block.prime-refabricator.description = Opgraderer indsatte enheder til niveau 3.
block.basic-assembler-module.description = Forøger samler-niveauet, når det placeres ved siden af en konstruktionsgrænse. Kræver strøm. Kan bruges som nyttelast-input.
block.small-deconstructor.description = Deconstructs inputted structures and units. Returns 100% of the build cost.
block.reinforced-payload-conveyor.description = Flytter nyttelast fremad.
block.reinforced-payload-router.description = Fordeler nyttelast til tilstødende blokke. Fungerer som en sorterer, når et filter er indstillet.
block.payload-mass-driver.description = Langtrækkende transportstruktur til nyttelast. Skyder modtaget nyttelast til forbundne nyttelast-massedrivere.
block.large-payload-mass-driver.description = Langtrækkende transportstruktur til nyttelast. Skyder modtaget nyttelast til forbundne nyttelast-massedrivere.
block.unit-repair-tower.description = Reparerer alle enheder i sin nærhed. Kræver ozon.
block.radar.description = Afslører gradvist terræn og fjendtlige enheder i en stor radius. Kræver strøm.
block.shockwave-tower.description = Beskadiger og ødelægger fjendtlige projektiler i en radius. Kræver cyanogen.
block.canvas.description = Viser et simpelt billede med en foruddefineret palet. Kan redigeres.
block.large-canvas.description = Viser et simpelt billede med en foruddefineret palet. Kan redigeres.

unit.dagger.description = Affyrer standardprojektiler mod alle nærliggende fjender.
unit.mace.description = Affyrer en strøm af ild mod alle fjendtlige enheder i nærheden.
unit.fortress.description = Affyrer langtrækkende artilleriskud mod fjendtlige strukturer.
unit.scepter.description = Affyrer en masse af projektiler og energistød mod alle fjender.
unit.reign.description = Affyrer massive gennemborende haglskud mod fjendtlige baser.
unit.nova.description = Affyrer helbredende lasere der skader fjender og helbreder venligsindede strukturer.
unit.pulsar.description = Affyrer elektriske stød der giver skold til venligsindede enheder og skader fjender.
unit.quasar.description = Udstyret med et kraftigt skjold og tung laserstråling.
unit.vela.description = Affyrer en massiv smelte-stråle der antænder og gennembryder mål.
unit.corvus.description = Affyrer en enorm laserstråle over ekstrem lang afstand.
unit.crawler.description = Runs toward enemies and self-destructs, causing a large explosion.
unit.atrax.description = Affyrer lammende kugler af slagger mod landmål. Kan træde over det meste terræn.
unit.spiroct.description = Fires sapping laser beams at enemies, repairing itself in the process. Can step over most terrain.
unit.arkyid.description = Fires large sapping laser beams at enemies, repairing itself in the process. Can step over most terrain.
unit.toxopid.description = Fires large electric cluster-shells and piercing lasers at enemies. Can step over most terrain.
unit.flare.description = Hurtig luftrekognosceringsenhed. Affyrer lette skud.
unit.horizon.description = Affyrer klyngebomber over fjendtlige jordmål.
unit.zenith.description = Affyrer missiler mod nærliggende luft- og landmål.
unit.antumbra.description = Affyrer en spredning af tunge projektiler mod omgivende enheder.
unit.eclipse.description = Et enormt luftslagskib der affyrer lasere og tungt artilleri.
unit.mono.description = Automatisk minedriftenhed. Indsamler kobber og bly og leverer det til kernen.
unit.poly.description = Automatisk konstruktionsenhed. Genopbygger ødelagte bygninger og hjælper med konstruktion.
unit.mega.description = Reparations- og transportenhed. Bærer blokke og helbreder sårede strukturer.
unit.quad.description = Kaster tunge bomber der helbreder allierede og skader fjendtlige strukturer.
unit.oct.description = En enorm beskyttelsesenhed med et massivt skjold der beskytter nærliggende tropper.
unit.risso.description = Affyrer skud og missiler mod luft- og landmål.
unit.minke.description = Udstyret med artilleri og flak-tårne til kyst- og flådekamp.
unit.bryde.description = Tung flådeenhed der affyrer langtrækkende missiler og artilleri.
unit.sei.description = Affyrer salver af missiler og tunge skud mod kystforsvar.
unit.omura.description = Et enormt flådeslagskib med langtrækkende jernbanekanon.
unit.alpha.description = Forsvarer Splint-kernen mod fjender. Bygger strukturer.
unit.beta.description = Forsvarer Fundament-kernen mod fjender. Bygger strukturer.
unit.gamma.description = Forsvarer Nukleus-kernen mod fjender. Bygger strukturer.
unit.retusa.description = Fires homing torpedoes at nearby enemies. Repairs allied units.
unit.oxynoe.description = Fires structure-repairing streams of flame at nearby enemies. Targets nearby enemy projectiles with a point defense turret.
unit.cyerce.description = Fires seeking cluster-missiles at enemies. Repairs allied units.
unit.aegires.description = Chokerer alle fjendtlige enheder og strukturer, der kommer ind i dens energifelt. Reparerer alle allierede.
unit.navanax.description = Fires explosive EMP projectiles, dealing significant damage to enemy power networks and repairing allied structures. Melts nearby enemies with 4 autonomous laser turrets.

#Erekir
unit.stell.description = Lille pansret bæltetank på Erekir. Affyrer skud mod fjendtlige mål.
unit.locus.description = Mellemstor tank med dobbeltkanon til gennembrud af fjendtlige linjer.
unit.precept.description = Tung pansret tank der affyrer kraftige eksplosive projektiler.
unit.vanquish.description = Massiv angrebstank med enorm ildkraft og pansring.
unit.conquer.description = Den stærkeste angrebstank på Erekir. Knuser alt på sin vej.
unit.merui.description = Let firbenet enhed der kan hoppe over forhindringer og terræn.
unit.cleroi.description = Mellemstor firbenet enhed med dobbelt skudkadence.
unit.anthicus.description = Tung firbenet enhed der affyrer langtrækkende søgende missiler.
unit.tecta.description = Avanceret firbenet enhed med indbygget beskyttelsesskjold.
unit.collaris.description = Massivt firbenet artilleri der affyrer langtrækkende granater.
unit.elude.description = Hurtig svævende luftenhed på Erekir. God til rekognoscering.
unit.avert.description = Luftenhed der kaster brandbomber over fjendtlige baser.
unit.obviate.description = Tung luftenhed der affyrer energibølger mod landmål.
unit.quell.description = Langtrækkende luftbomber med søgende missiler.
unit.disrupt.description = Massivt luftslagskib der deaktiverer fjendtlige forsvarsværker.
unit.evoke.description = Builds structures to defend the Bastion core. Repairs structures with a beam.
unit.incite.description = Builds structures to defend the Citadel core. Repairs structures with a beam.
unit.emanate.description = Builds structures to defend the Acropolis core. Repairs structures with beams.

lst.read = Read a number from a linked memory cell.
lst.write = Write a number to a linked memory cell.
lst.print = Tilføj tekst til udskriftsbufferen.\nViser ikke noget før [accent]Print Flush[] anvendes.
lst.printchar = Tilføj et UTF-16-tegn eller indholdsikon til udskriftsbufferen.\nViser ikke noget før [accent]Print Flush[] anvendes.
lst.format = Erstat næste pladsholder i tekstbufferen med en værdi.\nGør intet, hvis pladsholdermønsteret er ugyldigt.\nPladsholdermønster: "{[accent]tal 0-9[]}"\nEksempel:\n[accent]print "test {0}"\nformat "eksempel"
lst.draw = Tilføj en operation til tegnebufferen.\nViser ikke noget før [accent]Draw Flush[] anvendes.
lst.drawflush = Send queued [accent]Draw[]-operationer til et display.
lst.printflush = Send udskriftsbufferen til en meddelelsesblok.
lst.getlink = Hent et processorlink efter indeks. Starter ved 0.
lst.control = Styr en bygning.
lst.radar = Lokaliser enheder omkring en bygning inden for rækkevidde.
lst.sensor = Hent data fra en bygning eller enhed.
lst.set = Tildel en værdi til en variabel.
lst.operation = Udfør en operation på 1-2 variabler.
lst.select = Betinget tildeling af en variabel til én af to værdier.
lst.end = Hop til toppen af instruktionsstakken.
lst.wait = Vent et bestemt antal sekunder.
lst.stop = Stands kørslen af denne processor.
lst.lookup = Look up an item/liquid/unit/block type by ID.\nTotal counts of each type can be accessed with:\n[accent]@unitCount[] / [accent]@itemCount[] / [accent]@liquidCount[] / [accent]@blockCount[]
lst.jump = Betinget hop til en anden instruktion.
lst.unitbind = Bind til den næste enhed af en type, og gem den i [accent]@unit[].
lst.unitcontrol = Styr den aktuelt bundne enhed.
lst.unitradar = Lokaliser enheder omkring den aktuelt bundne enhed.
lst.unitlocate = Lokaliser en bestemt type position/bygning hvor som helst på kortet.\nKræver en bundet enhed.
lst.getblock = Hent feltdata på enhver placering.
lst.setblock = Sæt feltdata på enhver position.
lst.spawnunit = Frembringer en enhed på en position.
lst.spawnbullet = Frembringer et projektil på en position.
lst.applystatus = Apply or clear a status effect from a uniut.
lst.weathersense = Tjek om en vejrtype er aktiv.
lst.weatherset = Indstil den aktuelle tilstand for en vejrtype.
lst.spawnwave = Simulate a wave being spawned at a arbitrary location.\nWill not increment the wave counter.
lst.explosion = Opret en eksplosion på en position.
lst.setrate = Indstil processorens eksekveringshastighed i instruktioner/tick.\nKan ikke overstige den maksimale eksekveringshastighed.
lst.fetch = Find enheder, kerner, spillere eller bygninger efter indeks.\nIndekser starter ved 0 og slutter ved deres returnerede antal.
lst.packcolor = Pak [0, 1] RGBA-komponenter til et enkelt tal til tegning eller regelindstilling.
lst.unpackcolor = Udpak RGBA-komponenter fra en farve, der blev pakket med Pack Color.
lst.setrule = Indstil en spilregel.
lst.flushmessage = Display a message on the screen from the text buffer.\nWill wait until the previous message finishes.
lst.cutscene = Styr spillerens kamera.
lst.setflag = Sæt et globalt flag, som kan læses af alle processorer.
lst.getflag = Tjek om et globalt flag er sat.
lst.setprop = Indstiller en egenskab for en enhed eller bygning.
lst.effect = Opret en partikeleffekt.
lst.sync = Sync a variable across the network.\nOnly invoked 10 times a second at most.
lst.playsound = Afspiller en lyd.\nLydstyrke og panorering kan være en global værdi eller beregnet ud fra position.
lst.playmusic = Plays a music track by name, e.g. [accent]"game1"[].\nIf [accent]interrupt[] is true, the previously playing music will be stopped.\nPlaying with null music and interrupt set to true will stop the current track.\nNote that music from data patches must be prefixed with [accent]dp-[].
lst.makemarker = Opret en ny logikmarkør i verdenen.\nDer skal angives et ID til at identificere denne markør.\nMarkører er i øjeblikket begrænset til 20.000 pr. verden.
lst.setmarker = Set a property for a marker.\nThe ID used must be the same as in the Make Marker instruction.
lst.localeprint = Tilføj kortets sprogtekstværdi til tekstbufferen.\nFor at indstille kortsprogtekster i kortredigering, tjek [accent]Kortinfo > Sprogpakker[].\nHvis klienten er en mobilenhed, forsøges en egenskab med endelsen ".mobile" først.
lst.query = Forespørger enheder/bygninger i et specificeret område.\nResultater udsendes til [accent]@queries[].\nResultater kan læses fra [accent]@queries[] ved hjælp af instruktionen [accent]Read[] og et indeks.\nLængden af [accent]@queries[] kan aflæses ved hjælp af [accent]@size[] som parameter.

