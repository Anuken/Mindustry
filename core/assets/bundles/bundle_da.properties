sector.onset.description = Påbegynd erobringen af Erekir. Indsaml ressourcer, fremstil enheder, og begynd at udforske teknologi.
sector.aegis.description = Denne sektor indeholder forekomster af wolfram.\nUdforsk [accent]slagboret[] for at udvinde denne ressource, og ødelæg den fjendtlige base i området.
sector.lake.description = Denne sektors slaggesø begrænser anvendelige enheder markant. En svæveenhed er den eneste mulighed.\nUdforsk [accent]skibsfremstilleren[] og fremstil en [accent]elude[]-enhed så hurtigt som muligt.
sector.intersect.description = Et strategisk knudepunkt. Erobring af denne sektor sikrer vigtige forsyningslinjer.
sector.atlas.description = This sector contains varied terrain and will require a variety of units to attack effectively.\nUpgraded units may also be necessary to get past some of the tougher enemy bases detected here.\nResearch the [accent]Electrolyzer[] and the [accent]Tank Refabricator[].
sector.split.description = Den minimale fjendtlige tilstedeværelse i denne sektor gør den perfekt til afprøvning af ny transportteknologi.
sector.basin.description = Startområdet på planeten Erekir. Rig på beryllium. Lær at bruge kanaler og fremstille basisenheder.
sector.marsh.description = Denne sektor har rigelige mængder arkycit, men begrænsede åbninger.\nByg [accent]kemiske forbrændingskamre[] for at generere strøm.
sector.peaks.description = Et faretruende bjergrigt område på Erekir. Kræver lufttransport og præcis logistik.
sector.ravine.description = En dyb kløft med stærke fjendtlige stillinger. Udnyt plasmaboring til udvinding af tunge råstoffer.
sector.caldera-erekir.description = Ressourcerne opdaget i denne sektor er spredt over flere øer.\nUdforsk og indsæt dronebaseret transport.
sector.stronghold.description = En kraftigt befæstet fjendtlig base på Erekir. Kræver tunge T3-enheder og gennembrudstaktik.
sector.crevice.description = Et klipperigt område med mange fjendtlige patruljer. Pas på uventede flankeangreb.
sector.siege.description = Denne sektor byder på to parallelle kløfter, der vil tvinge dig til et todelt angreb.\nUdforsk [accent]cyanogen[] for at få mulighed for at skabe endnu stærkere tansenheder.\nForsigtig: fjendtlige langtrækkende missiler er blevet registreret. Missilerne kan skydes ned inden nedslag.
sector.crossroads.description = Fjendens baser i denne sektor er etableret i varieret terræn. Udforsk forskellige enheder for at tilpasse dig.\nDerudover er nogle baser beskyttet af skjolde. Find ud af, hvordan de forsynes med strøm.
sector.karst.description = Denne sektor er rig på ressourcer, men vil blive angrebet af fjenden, så snart en ny kerne lander.\nUdnyt ressourcerne og udforsk [accent]fasestof[].
sector.origin.description = Hovedbasen for fjendens operationer på Erekir. Den ultimative udfordring på planeten.

