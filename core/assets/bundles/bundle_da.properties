lglobal.@second = Spilletid for den aktuelle gemmefil, i sekunder
lglobal.@minute = Spilletid for den aktuelle gemmefil, i minutter
lglobal.@waveNumber = Aktuelt bølgenummer, hvis bølger er aktiveret
lglobal.@waveTime = Nedtællingstimer til næste bølge, i sekunder
lglobal.@mapw = Kortbredde i felter
lglobal.@maph = Korthøjde i felter

