tasks.register('generateIcons'){
    doLast{
        def iconDir = rootProject.file("core/assets-raw/icons")
        def mapFile = new File(iconDir, "codepoints.json")
        def outDir = rootProject.file("core/assets/fonts")
        def svgs = iconDir.listFiles({ f -> f.name.endsWith(".svg") } as FileFilter).sort { it.name }

        //existing [{name, code}] entries -> name to codepoint
        Map<String, Integer> codes = [:]
        if(mapFile.exists()) new JsonSlurper().parse(mapFile).each{ codes[it.name as String] = it.code as Integer }

        //new icons get the next free codepoint
        int next = Math.max(0xE800, (codes.values().max() ?: 0) + 1)
        svgs.each{ f ->
            def name = f.name.replace(".svg", "")
            if(!codes.containsKey(name)) codes[name] = next++
        }

        //only keep icons that exist, sorted by codepoint
        def used = svgs.collect{ it.name.replace(".svg", "") }
        codes = codes.findAll{ k, v -> used.contains(k) }.sort{ it.value }
        mapFile.text = "[\n" + codes.collect{ k, v -> "    " + JsonOutput.toJson([name: k, code: v]) }.join(",\n") + "\n]\n"

        def config = new File(temporaryDir, "fantasticon.json")
        config.text = JsonOutput.toJson([
                inputDir: iconDir.absolutePath, outputDir: outDir.absolutePath, name: "icon",
                fontTypes: ["ttf"], assetTypes: [], normalize: true, codepoints: codes
        ])

        outDir.mkdirs()
        def cmd = [System.getProperty("os.name").toLowerCase().contains("win") ? "npx.cmd" : "npx", "--yes", "fantasticon", "--config", config.absolutePath]
        def pb = new ProcessBuilder(cmd).redirectErrorStream(true)
        def proc = pb.start()
        proc.outputStream.close()
        proc.inputStream.eachLine{ println it }
        if(proc.waitFor() != 0) throw new GradleException("fantasticon failed!")
    }
}

